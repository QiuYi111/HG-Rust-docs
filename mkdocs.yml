site_name: HarnessGraph
site_description: Build an agent graph with two primitives.
site_url: https://qiuyi111.github.io/HG-Rust-docs/
repo_name: QiuYi111/HG-Rust
repo_url: https://github.com/QiuYi111/HG-Rust
edit_uri: edit/main/docs/

exclude_docs: |
  en/cases/**
  en/examples/**
  en/cli.md
  en/comparison.md
  en/configuration-reference.md
  en/executors.md
  en/glossary.md
  en/lifecycle.md
  en/operations.md
  zh/cases/**
  zh/examples/**
  zh/cli.md
  zh/comparison.md
  zh/configuration-reference.md
  zh/executors.md
  zh/glossary.md
  zh/lifecycle.md
  zh/operations.md

theme:
  name: material
  language: zh
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    scheme: default

nav:
  - Home: index.md
  - 中文:
      - 项目首页: zh/index.md
      - 核心哲学: zh/principles.md
      - Quick Start: zh/quick-start.md
      - 核心模型:
          - 两个原语: zh/model.md
          - 图如何自然派生: zh/composition.md
          - 配置与执行器: zh/configuration.md
      - 教程案例:
          - 案例路线: zh/tutorials/index.md
          - 番茄钟: zh/tutorials/pomodoro.md
          - Learning Helper: zh/tutorials/learning-helper.md
          - Grill: zh/tutorials/grill.md
          - Acquired: zh/tutorials/acquired.md
          - Harness Lifecycle: zh/tutorials/harness.md
          - CAD Release: zh/tutorials/cad-release.md
      - 图语义实验室: zh/graph-lab.md
      - CLI 与运行: zh/reference.md
      - 发布说明: zh/release.md
  - English:
      - Project home: en/index.md
      - Core philosophy: en/principles.md
      - Quick Start: en/quick-start.md
      - Core model:
          - Two primitives: en/model.md
          - How graphs emerge: en/composition.md
          - Configuration and executors: en/configuration.md
      - Tutorials:
          - Learning path: en/tutorials/index.md
          - Pomodoro: en/tutorials/pomodoro.md
          - Learning Helper: en/tutorials/learning-helper.md
          - Grill: en/tutorials/grill.md
          - Acquired: en/tutorials/acquired.md
          - Harness Lifecycle: en/tutorials/harness.md
          - CAD Release: en/tutorials/cad-release.md
      - Graph semantics lab: en/graph-lab.md
      - CLI and operations: en/reference.md
      - Release notes: en/release.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: Copyright © 2026 HarnessGraph contributors
