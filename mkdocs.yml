theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 使用深色外观
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 使用浅色外观

nav:
  - Home: index.md
  - 中文:
      - 产品介绍: zh/index.md
      - Quick Start: zh/quick-start.md
      - 核心模型:
          - 核心哲学: zh/principles.md
          - 与现有产品的对比: zh/comparison.md
          - 对象模型: zh/model.md
          - 执行生命周期: zh/lifecycle.md
      - 配置:
          - 配置总览: zh/configuration.md
          - 执行器与策略: zh/executors.md
          - 配置参考: zh/configuration-reference.md
      - 四个实操教程:
          - 教程总览: zh/cases/index.md
          - Learning Helper: zh/cases/learning-helper.md
          - Acquired Podcast: zh/cases/acquired-podcast.md
          - Harness Lifecycle: zh/cases/harness-lifecycle.md
          - CAD Release: zh/cases/cad-release.md
          - 运行证据: zh/cases/evidence.md
      - 功能参考与小例子:
          - 参考总览: zh/examples/reference.md
      - 使用与参考:
          - CLI: zh/cli.md
          - 运行、恢复与审计: zh/operations.md
          - 术语表: zh/glossary.md
          - 发布说明: zh/release.md
  - English:
      - Product overview: en/index.md
      - Quick Start: en/quick-start.md
      - Core model:
          - Philosophy: en/principles.md
          - Comparison: en/comparison.md
          - Object model: en/model.md
          - Execution lifecycle: en/lifecycle.md
      - Configuration:
          - Configuration overview: en/configuration.md
          - Executors and policies: en/executors.md
          - Reference: en/configuration-reference.md
      - Four hands-on tutorials:
          - Tutorial overview: en/cases/index.md
          - Learning Helper: en/cases/learning-helper.md
          - Acquired Podcast: en/cases/acquired-podcast.md
          - Harness Lifecycle: en/cases/harness-lifecycle.md
          - CAD Release: en/cases/cad-release.md
          - Run evidence: en/cases/evidence.md
      - Feature reference and small examples:
          - Reference overview: en/examples/reference.md
      - Use and reference:
          - CLI: en/cli.md
          - Operations, recovery, and audit: en/operations.md
          - Glossary: en/glossary.md
          - Release notes: en/release.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

